name: Build and Release OpenTTD NewGRF

on:
  push:
    branches: [ main, econ-contract-normalization ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate-and-build:
    name: Validate Contract and Compile NewGRF
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nml

      - name: Validate Core Economy contract
        run: python tools/validate_economy.py

      - name: Validate playable core chain
        run: python tools/validate_playable_chain.py

      - name: Assemble modular NML entry point
        run: python tools/build_newgrf.py

      - name: Compile OpenTTD NewGRF
        run: |
          nmlc -o games/openttd/newgrf/core_economy.grf --lang=games/openttd/newgrf/lang games/openttd/newgrf/core_economy.nml

      - name: Package distribution archive
        run: |
          mkdir -p dist
          cp games/openttd/newgrf/core_economy.grf dist/
          cp games/openttd/newgrf/README.md dist/INSTALL-README.md
          cp games/openttd/newgrf/mapping.md dist/
          cp LICENSE dist/ 2>/dev/null || true
          cd dist && zip -r ../core-economy-openttd-newgrf.zip .

      - name: Upload compiled GRF artifact
        uses: actions/upload-artifact@v4
        with:
          name: core_economy.grf
          path: games/openttd/newgrf/core_economy.grf
          if-no-files-found: error

      - name: Upload distribution zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: core-economy-openttd-newgrf.zip
          path: core-economy-openttd-newgrf.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: validate-and-build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download compiled GRF artifact
        uses: actions/download-artifact@v4
        with:
          name: core_economy.grf
          path: .

      - name: Download distribution zip artifact
        uses: actions/download-artifact@v4
        with:
          name: core-economy-openttd-newgrf.zip
          path: .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            core_economy.grf
            core-economy-openttd-newgrf.zip
          generate_release_notes: true

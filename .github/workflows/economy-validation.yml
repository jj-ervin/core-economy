name: Economy Contract Validation

on:
  push:
    branches: [main, econ-contract-normalization]
  pull_request:
    paths:
      - 'data/reference-economy/**'
      - 'schema/**'
      - 'tools/validate_economy.py'
      - '.github/workflows/economy-validation.yml'

jobs:
  validate-economy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate core economy contract
        run: python tools/validate_economy.py

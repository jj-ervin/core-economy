name: Economy Contract & NewGRF Validation

on:
  push:
    branches: [main, econ-contract-normalization]
  pull_request:
    paths:
      - 'data/reference-economy/**'
      - 'schema/**'
      - 'tools/validate_economy.py'
      - 'games/openttd/newgrf/**'
      - '.github/workflows/**'

jobs:
  validate-economy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nml
      - name: Validate core economy contract
        run: python tools/validate_economy.py
      - name: Compile OpenTTD NewGRF
        run: nmlc -o games/openttd/newgrf/core_economy.grf --lang=games/openttd/newgrf/lang games/openttd/newgrf/core_economy.nml
